# ── InvestX – Nginx reverse proxy ──
# Fichier : /etc/nginx/sites-available/investx
# Activer : ln -s /etc/nginx/sites-available/investx /etc/nginx/sites-enabled/
# Tester  : nginx -t && systemctl reload nginx

# ── Upstream ──
upstream investx_backend {
    server 127.0.0.1:8600;
}
upstream investx_dashboard {
    server 127.0.0.1:8601;
}

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_OR_IP;

    # ──── SSL (Let's Encrypt) ────
    # Décommentez après avoir fait  certbot certonly --webroot ...
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ──── SSL (auto-signé pour démarrage rapide) ────
    ssl_certificate     /etc/ssl/certs/investx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/investx-selfsigned.key;

    # ──── Headers sécurité ────
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # ──── Backend API ────
    location /api/ {
        proxy_pass http://investx_backend/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ──── Stripe Webhook (body brut nécessaire) ────
    location /api/billing/webhook {
        proxy_pass http://investx_backend/billing/webhook;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Stripe-Signature  $http_stripe_signature;
        proxy_read_timeout 30s;
    }

    # ──── Streamlit Dashboard ────
    location / {
        proxy_pass http://investx_dashboard;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (requis par Streamlit)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ──── Streamlit _stcore (WebSocket path) ────
    location /_stcore/ {
        proxy_pass http://investx_dashboard/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
